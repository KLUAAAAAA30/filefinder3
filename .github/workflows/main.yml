name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install python-dotenv

    - name: Load environment variables
      run: |
        # Load environment variables from .env
        python -c "import os; from dotenv import load_dotenv; load_dotenv('.env'); print(os.environ.get('MYSQL_ROOT_PASSWORD'))"

    - name: Set up MySQL
      run: |
        # Use the environment variables loaded by the previous step
        mysql -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} < SQLScripts/lisney_files_info8_bp_14Feb2024.sql
        mysql -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} < SQLScripts/sql_Cased_Dimensions14Jan2024_v2.sql

    - name: Run Python scripts
      run: |
        python FileFinder_19/file_info_mapfolders.py
        python FileFinder_19/file_info_version_22.py
        python FileFinder_19/machine_info_migration_centre.py

    - name: Run PowerShell script (optional)
      if: runner.os == 'Windows'
      run: |
        pwsh -File PowerShell/PS__ArunV2_Final_8Feb2024.ps1
      shell: pwsh
